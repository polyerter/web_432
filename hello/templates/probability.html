    <h1>Задание 1. Теория вероятностей</h1>

    <p>
        На экзамене 25 билетов. Сергей не выучил 3 билета.
        Найдите вероятность того, что ему попадётся выученный билет.
    </p>

    <h3>Решение:</h3>

    <p>1. Найдём количество выученных билетов:</p>
    <p>25 - 3 = 22</p>

    <p>2. Найдём вероятность:</p>
    <p>22 / 25 = 0,88</p>

    <p><b>Ответ: 0,88.</b></p>
